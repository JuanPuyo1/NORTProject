services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nort}
      POSTGRES_USER: ${POSTGRES_USER:-nort}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nort} -d ${POSTGRES_DB:-nort}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      platforms:
        - linux/amd64
    image: ${DOCKER_IMAGE:-nort-website:local}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      DEBUG: ${DEBUG:-False}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
