{% for post in page %}
  <a href="{{ post.get_absolute_url }}" class="post-row block border-t border-base-300 py-5 lg:py-7 hover:bg-base-100/50 transition-colors">
    <div class="flex items-center gap-2">
      <span class="text-xs text-base-content/60">{{ post.published_at|date:"M j, Y" }}</span>
      <span class="badge bg-base-200 border-0 rounded-full px-2.5 py-1 text-[11px] font-medium text-base-content/60">{{ post.category_label }}</span>
    </div>
    <h3 class="mt-3 text-lg lg:text-[22px] font-medium leading-6">{{ post.title }}</h3>
    <p class="mt-3 text-sm lg:text-[15px] leading-[22px] lg:leading-6 text-base-content/60">{{ post.excerpt }}</p>
  </a>
{% endfor %}
{% if has_more %}
  <div id="load-more-wrap" hx-swap-oob="true" class="flex justify-center col-span-full w-full mt-6 lg:mt-8">
    <button
      class="btn btn-outline rounded-full px-5 py-3 min-h-0 h-auto w-full lg:w-fit text-sm font-medium"
      hx-get="{% url 'blog:list' %}?category={{ category }}&page={{ next_page }}&partial=rows"
      hx-target="#post-list-rows"
      hx-swap="beforeend"
    >
      Load more notes
    </button>
  </div>
{% else %}
  <div id="load-more-wrap" hx-swap-oob="true"></div>
{% endif %}
